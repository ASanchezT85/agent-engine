# DESACTIVADO A PROPOSITO. La cuenta tiene Actions bloqueado por facturacion: el job
# no llega ni a arrancar, falla en 2 segundos y marca cada commit con una X roja como
# si los tests estuvieran rotos. No lo estan (30/30 en local, `bun test`).
#
# Solo se dispara a mano desde la pestaña Actions. Para volver a lo normal, cuando
# Actions pueda correr, sustituye `workflow_dispatch:` por:
#
#   push:
#     branches: [master]
#   pull_request:
#
# y devuelve el badge al README:
#   [![tests](https://github.com/ASanchezT85/agent-engine/actions/workflows/test.yml/badge.svg)](https://github.com/ASanchezT85/agent-engine/actions/workflows/test.yml)
name: tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # No hay `bun install`: el proyecto no tiene dependencias.
      # Los tests no necesitan ninguna herramienta de IA instalada: los adapters
      # detectan que no estan y el resto trabaja sobre bases y ficheros temporales.
      - run: bun test
